[package]
name = "chloride-tui"
version = "2.1.1"
edition = "2024"

[[bin]]
name = "cl"
path = "src/main.rs"

# Users download this binary on every update — keep it small.
[profile.release]
strip = true
lto = "thin"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
ratatui = "0.30.2"
# rustls (not the default OpenSSL) so the musl target links statically with no
# system deps, and so the cert roots ship in the binary.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-channel = "2"
crossterm = "0.29"
# Column widths for emoji/CJK in the inline UIs. Already in the tree via
# ratatui, so this costs nothing.
unicode-width = "0.2"
# ripgrep's own engine, linked in — no `rg` binary needed at runtime.
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
